[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2midi"
version = "0.1.0"
description = "Offline Python tool for converting YouTube audio performances to MIDI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [
  {name = "audio_to_midi_converter contributors"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10,<1.13",
  "librosa>=0.10.2",
  "soundfile>=0.12.1",
  "yt-dlp>=2025.1.26",
  "mido>=1.3.3",
  "torch>=2.2",
  "piano-transcription-inference>=0.0.6",
  "basic-pitch>=0.3.0",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
audio2midi = "audio2midi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["audio2midi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
